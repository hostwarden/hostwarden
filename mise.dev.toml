# The tools scripts/check.sh needs beyond mise.toml's, at the
# versions CI runs. Loaded only with MISE_ENV=dev, on top of
# mise.toml, so a checkout used to run Hostwarden carries none of
# them:
#
#   MISE_ENV=dev mise install
#
# Backends are spelled out so Renovate, which keeps these
# versions current, can resolve each tool to its releases.
[tools]
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:betterleaks/betterleaks" = "1.8.1"
node = "24.21.0"
