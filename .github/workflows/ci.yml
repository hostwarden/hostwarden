name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the tree, nothing else. The checkout does not keep the token
# either: no step here pushes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: dev # mise.dev.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The secret scan reads the whole history.
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Renovate cannot see a version pinned here; wait the
          # same seven days it waits for everything else.
          minimum_release_age: 7d

      # Add checks to scripts/check.sh, not here.
      - name: Check
        run: sh scripts/check.sh
