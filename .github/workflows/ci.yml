name: CI

on:
  # Not `edited`: a new body changes nothing this checks, and a run
  # for one would cancel the run on the head. The body is
  # review-record.yml's.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue checks each group's merge commit, and `check` is
  # required there too: a queue whose check never reports waits.
  merge_group:
  # By hand, on any branch. A push to main is not checked again:
  # the queue checked that very commit before it landed. One that
  # bypassed the queue is run by hand:
  # .claude/rules/pull-requests.md → Checks.
  workflow_dispatch:

# Read the tree, nothing else. The checkout does not keep the token
# either: no step here pushes.
permissions:
  contents: read

# A new push to a pull request cancels the run on the head it
# replaces. The queue and a run by hand get a group of their own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: dev # mise.dev.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The secret scan reads the whole history.
          fetch-depth: 0
          # A pull request, draft or not, is checked on its own head,
          # against its base; the queue on its group's merge commit.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Renovate keeps this pin current, as it does the one in
          # .claude/hooks/dev-tools.sh, and holds each release back
          # seven days.
          version: v2026.9.10

      # website_build (scripts/check.sh) runs `npm ci` on every full
      # run; this only saves the download, install still runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('website/package-lock.json') }}
          restore-keys: npm-

      # The awks bin/hostwarden-wrap has to work with, which
      # tests/bin/hostwarden-wrap.sh runs it under.
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gawk mawk original-awk busybox gnupg

      # Add checks to scripts/check.sh, not here. A pull request, draft
      # or not, gets what a push of its commits onto the base gets:
      # every check but the matrices whose files it leaves alone. Only
      # the queue, and a run by hand, run all of it: the queue checks
      # the pull request on `main` as it will be, which no earlier run
      # can.
      - name: Check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "HEAD $(git rev-parse HEAD) refs/heads/pull-request $BASE" \
              | sh scripts/check.sh --pre-push
          else
            sh scripts/check.sh
          fi

  # On a machine without mise, the hooks and bin/ scripts run with the
  # jq the distribution ships. `check` above never sees it: mise.toml
  # pins the newest jq, Renovate keeps it current, and scripts/check.sh
  # puts it first on PATH. This job runs the matrices under Ubuntu
  # 24.04's jq (1.7; `ubuntu-latest` already ships a 1.8, which would
  # leave the two alike): `scripts/check.sh --jq`. A jq program that
  # only one of them accepts is red here or in `check`; this job is
  # not a required check, so it informs and does not block the queue.
  # Not in a draft, which is scoped to what its commits touch: this is
  # the extra run.
  distro-jq:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the distribution's jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jq
          test "$(command -v jq)" = /usr/bin/jq
          jq --version

      - name: Matrices
        run: sh scripts/check.sh --jq
