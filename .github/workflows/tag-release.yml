name: Tag release on VERSION bump

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    # Pushing the tag is the only write, and this job is the only
    # one that needs it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read VERSION
        id: v
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.v.outputs.version }}" -m "Release v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

      # Cuts a new Docusaurus doc version for the major line, if
      # this release started one — website/ has no versioned_docs/
      # of its own to update (docusaurus.config.js → docs, and
      # .claude/rules/repo-release.md → VERSION). Runs whether or
      # not this attempt is the one that pushed the tag: a
      # dispatch's own failure (dispatch-docs exits 1 on anything
      # but a 404) has to be retryable by re-running the failed
      # job, which finds the tag already there and would otherwise
      # skip this step too, losing the release event for good.
      - name: Dispatch release-cut
        uses: ./.github/actions/dispatch-docs
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          event-type: release-cut
          version: ${{ steps.v.outputs.version }}
